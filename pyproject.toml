[project]
name = "mcp-team-config"
version = "2.0.0"
description = "MCP server for managing team configurations across Windsurf, Cursor, and VS Code with centralized rules, workflows, and security"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10.1",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.0",
    "pyyaml>=6.0.1",
    "gitpython>=3.1.40",
]

[project.scripts]
mcp-team-config = "main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "main",
    "config_loader",
    "content_tracker",
    "frontmatter_utils",
    "ide_adapter",
    "ide_manager",
    "mcp_tools",
    "mcp_tools_consolidated",
    "repo_manager",
    "schemas",
    "security_validator"
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*", "rules*", "workflows*", "*.egg-info"]
